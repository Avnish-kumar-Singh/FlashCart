apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcart-api
  namespace: flashcart
spec:
  replicas: 3
  selector:
    matchLabels: { app: flashcart-api }
  template:
    metadata:
      labels: { app: flashcart-api }
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/flashcart-api:latest
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - configMapRef: { name: flashcart-config }
            - secretRef: { name: flashcart-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: flashcart-api
  namespace: flashcart
spec:
  selector: { app: flashcart-api }
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flashcart-api
  namespace: flashcart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flashcart-api
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
